<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Noto Sans TC','Fredoka','Segoe UI Emoji',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow:hidden;}
body{padding:5px 7px;font-size:11px;user-select:none;min-width:200px;}

/* Header bar */
.hdr{display:flex;align-items:center;gap:4px;padding:1px 0 3px;}
.hdr .title{font-family:'Fredoka',sans-serif;font-size:11px;font-weight:700;color:var(--green-light);}
.hdr .mini-ver{display:inline-block;margin-left:3px;padding:0 5px;background:var(--gold,#ffd54f);color:#1a3a1a;border-radius:6px;font-size:9px;font-weight:900;font-family:'Fredoka',monospace;letter-spacing:0.3px;}
.hdr .spacer{flex:1;}
.hdr .sync{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--card);color:var(--green-light);border:1px solid #2e7d3244;}
.hdr .sync.off{color:var(--gold);border-color:#ff700344;}
.hdr .sync.err{color:var(--red);border-color:#ef535044;}
.hdr button{background:none;border:none;color:var(--text-dim);font-size:10px;cursor:pointer;padding:1px 3px;border-radius:3px;}
.hdr button:hover{background:var(--card-alt);color:var(--text);}
.hdr .tb-login{background:var(--card-alt);border:1px solid #ffffff20;color:var(--text-dim);padding:1px 5px;border-radius:3px;font-size:10px;font-family:inherit;cursor:pointer;}
.hdr .tb-login.on{border-color:var(--green);color:var(--green-light);}

/* Line row */
.row{display:flex;align-items:center;gap:5px;padding:2px 0;line-height:1.2;}
.row .ic{font-size:11px;width:12px;text-align:center;}
.row .val{font-family:'Fredoka',monospace;font-weight:700;color:var(--text);font-size:12px;}
.row .val.t{color:var(--green-light);}
.row .val.w{color:var(--blue-light);}
.row .sub{font-size:9px;color:var(--text-dim);white-space:nowrap;}
.row .spacer{flex:1;}
.row .act{padding:2px 7px;border-radius:3px;border:none;font-family:inherit;font-weight:700;font-size:10px;cursor:pointer;-webkit-appearance:none;appearance:none;white-space:nowrap;}
.row .act.green{background:linear-gradient(135deg,#81c784,var(--green-dark));color:#fff;}
.row .act.red{background:var(--card-alt);color:var(--text-dim);border:1px solid var(--line);}
.row .act.blue{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;}
.row .act.orange{background:#ff9a55;color:#fff;}
.row .act-undo{background:var(--card-alt);color:var(--text-dim);border:1px solid var(--line);border-radius:3px;font-size:10px;padding:2px 5px;cursor:pointer;-webkit-appearance:none;appearance:none;flex-shrink:0;}
.row .act-undo:active{transform:scale(0.9);}
.row .val.sn{color:#ffb877;}
.row .val.sn.over{color:#ef5350;font-weight:800;}
.row .act:active{transform:scale(0.96);}
.row .act:disabled{opacity:0.45;cursor:not-allowed;}

/* Stats line */
.stats{font-size:9px;color:var(--text-dim);padding:1px 0;display:flex;gap:7px;}
.stats .s{display:flex;align-items:center;gap:2px;}
.stats .s .v{color:var(--gold);font-family:'Fredoka',monospace;font-weight:700;}

.sep{height:1px;background:var(--line);margin:2px 0;}

/* Inline activity text (shows after standup within stats row) */
.act-inline{display:none;align-items:center;gap:3px;font-size:9px;color:var(--text-dim);min-width:0;flex:1;}
.act-inline.show{display:flex;}
.act-inline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
/* Activity complete button (next to water +0.5) */
.act-ok{background:linear-gradient(135deg,#81c784,var(--green-dark));color:#fff;border:none;border-radius:3px;font-size:11px;font-weight:700;padding:2px 7px;cursor:pointer;-webkit-appearance:none;appearance:none;flex-shrink:0;}
.act-ok:active{transform:scale(0.92);}

/* Toast */
.toast{position:fixed;top:2px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);color:var(--green-light);padding:3px 9px;border-radius:4px;font-size:10px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

body.theme-mario{--bg:#b8e0f7;--card:#fef6e4;--card-alt:#fdecd2;--green:#e52521;--green-light:#a61912;--green-dark:#7a1209;--blue:#1e5fdc;--blue-light:#0b3a9c;--blue-dark:#052670;--gold:#ffcd00;--text:#3d1a0a;--text-dim:#6b4520;--line:#7a120930;}

// get() with a timeout — Firebase's get() has no built-in timeout, so on a flaky network
// it can stay pending forever, leaving the sync chip stuck on "同步中". This rejects after
// `ms` so callers can surface an error / retry instead of hanging.
function getWithTimeout(r,ms=12000){
  return Promise.race([
    get(r),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))
  ]);
}

// === CONSTANTS (must match main app) ===

// === STATE ===
let S=null;

function defS(){return{
  thresh:30,todayStand:0,todayWater:0,

// Cross-day rollover — same logic as index.html
const LONGEST_WARN_SEC=45*60;
function maybeRollover(d){
  d=d||S;
  const today=new Date().toDateString();
  if(!d.lastDate||d.lastDate===today)return false;
  const oldLastDate=d.lastDate;
  if(!d.history||Array.isArray(d.history))d.history={};
  if(d.todayStand>0||d.todayWater>0||d.sessionSecTotal>0||d.restToday||d.todaySnack>0){
    const incoming={
      water:d.todayWater||0,
      waterMl:(d.todayWater||0)*ML,
      stands:d.todayStand||0,
      sessions:d.sessionsToday||0,
      workTimeSec:d.sessionSecTotal||0,
      longestSitSec:d.longestSit||0,
      rested:d.restToday||false,
      overLongSit:(d.longestSit||0)>=LONGEST_WARN_SEC,
      over45Count:d.over45CountToday||0,
      snack:d.todaySnack||0
    };
    const existing=d.history[oldLastDate];
    if(existing){
      // Merge with existing — Math.max preserves whichever is more complete
      d.history[oldLastDate]={
        water:Math.max(existing.water||0,incoming.water),
        waterMl:Math.max(existing.waterMl||0,incoming.waterMl),
        stands:Math.max(existing.stands||0,incoming.stands),
        sessions:Math.max(existing.sessions||0,incoming.sessions),
        workTimeSec:Math.max(existing.workTimeSec||0,incoming.workTimeSec),
        longestSitSec:Math.max(existing.longestSitSec||0,incoming.longestSitSec),
        rested:!!(existing.rested||incoming.rested),
        overLongSit:!!(existing.overLongSit||incoming.overLongSit),
        over45Count:Math.max(existing.over45Count||0,incoming.over45Count),
        snack:Math.max(existing.snack||0,incoming.snack),
        editedAt:existing.editedAt||0 // keep the manual-edit stamp (review #3)
      };
    }else{
      d.history[oldLastDate]=incoming;
    }
  }
  // Streak — same rule as index.html: consecutive day + (both goals met OR rest day)
  const diff=Math.floor((new Date(today)-new Date(oldLastDate))/864e5);
  if(diff===1){if((d.todayStand>=S_GOAL&&d.todayWater>=W_STREAK)||d.restToday)d.streak=(d.streak||0)+1;else d.streak=0;}
  else if(diff>1)d.streak=0;
  d.todayStand=0;d.todayWater=0;d.lastDate=today;d.restToday=false;
  d.sessionSecTotal=0;d.longestSit=0;d.sessionsToday=0;d.over45CountToday=0;
  d.inSession=false;d.sitStartAt=0;d.sessionStartAt=0;d.sessionAccum=0;d.alerted=false;
  d.sitGoalMetToday=false;d.waterGoalMetToday=false;
  // Snack pet: award a day if yesterday stayed within limit (recomputed from the count,
  // not the flag — same as index). Cap at adult threshold; no _pendingSnackLevelCheck
  // flag (index-local mechanism); hatch/graduation stays index's job.
  if((d.todaySnack||0)<=(d.snackLimit||3)){
    d.snackPetDays=Math.min((d.snackPetDays||0)+1,PET_ADULT_THRESHOLD);
  }
  d.todaySnack=0;d.snackGoalMetToday=true;
  return true;
}
// Minimal sync log (mini version — only critical events)
const SYNC_LOG_KEY='sync_log_v1';
const SYNC_LOG_MAX=500;
function getDeviceName(){return localStorage.getItem('device_name')||(localStorage.getItem('device_id')||'mini');}
function syncLog(event,details){
  try{

    const ts=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

}

// ===== V2 SCHEMA (same as index.html) =====

const STATE_KEYS=['todayStand','todayWater','todaySnack','lastDate','sessionSecTotal','longestSit','over45CountToday','sessionStartAt','sitStartAt','inSession','sessionAccum','alerted','lastWaterRemindAt','sitGoalMetToday','waterGoalMetToday','snackGoalMetToday','restToday','_over45TriggeredThisSession','_rolledOver','streak','sessionsToday','lastStand'];
const PETS_KEYS=['sitPetDays','sitPetSpecies','sitStageIdx','sitStageXP','waterPetDays','waterPetSpecies','waterStageIdx','waterStageXP','snackPetDays','snackPetSpecies','stageIdx','stageXP','sitHarvestCount','sitPlantedCount','waterHarvestCount','waterPlantedCount'];

const PET_LWW_KEYS=new Set(['sitStageIdx','sitStageXP','waterStageIdx','waterStageXP','stageIdx','stageXP']);
const SETTINGS_KEYS=['theme','thresh','snackLimit','soundOn','histEditEnabled','autoArchiveDisabled','_gardenPeriodStart','_gardenArchivedAt','_gardenPeriodKey'];

// v2.5: garden namespaced by period (garden/{periodKey}/{at}); see index.html for rationale.
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function periodKeyFrom(startTs){return monthKey(new Date(startTs||Date.now()));}
function currentPeriodKey(){return S._gardenPeriodKey || periodKeyFrom(S._gardenPeriodStart||S.firstUseAt||Date.now());}
function inActivePeriod(at){return (at||0) >= (S._gardenPeriodStart||0);}
function scopeGardenToPeriod(rawGarden,activeKey,periodStart){
  const out={};
  if(!rawGarden||typeof rawGarden!=='object')return out;
  const isPeriodKey=k=>/^\d{4}-\d{2}(-\d+)?$/.test(k);
  for(const k of Object.keys(rawGarden)){
    const v=rawGarden[k];
    if(isPeriodKey(k)){
      if(k===activeKey && v && typeof v==='object'){for(const at of Object.keys(v)) if(v[at]) out[at]=v[at];}
    }else{const g=v; if(g && g.at && (g.at>=(periodStart||0))) out[g.at]=g;}
  }
  return out;
}
function mergeGarden(localArr,cloudArr,archivedAt){
  const cut=archivedAt||0;
  const localAts=new Set((localArr||[]).map(g=>g?.at).filter(Boolean));
  const cloudAts=new Set((cloudArr||[]).map(g=>g?.at).filter(Boolean));
  const map=new Map();
  const consider=(g,fromCloud)=>{
    if(!g||!g.at)return;
    if(g.at<=cut){
      const onOtherSide=fromCloud?localAts.has(g.at):cloudAts.has(g.at);
      if(!onOtherSide)return;
    }
    if(!map.has(g.at))map.set(g.at,g);
  };
  for(const g of (localArr||[]))consider(g,false);
  for(const g of (cloudArr||[]))consider(g,true);
  // v2.5: only the active period's plants survive (structural anti-resurrection wall).
  return Array.from(map.values()).filter(g=>inActivePeriod(g.at)).sort((a,b)=>(a.at||0)-(b.at||0));
}
function mergeDayMax(a,b){
  if(!a)return b;
  if(!b)return a;
  return {
    stands:Math.max(a.stands||0,b.stands||0),
    water:Math.max(a.water||0,b.water||0),

    workTimeSec:Math.max(a.workTimeSec||0,b.workTimeSec||0),
    longestSitSec:Math.max(a.longestSitSec||0,b.longestSitSec||0),
    sessions:Math.max(a.sessions||0,b.sessions||0),

    overLongSit:!!(a.overLongSit||b.overLongSit),
    editedAt:Math.max(a.editedAt||0,b.editedAt||0) // manual-edit stamp (review #3)
  };
}
function normDay(d){
  d=d||{};
  return {stands:d.stands||0,water:d.water||0,waterMl:d.waterMl||0,workTimeSec:d.workTimeSec||0,longestSitSec:d.longestSitSec||0,sessions:d.sessions||0,snack:d.snack||0,over45Count:d.over45Count||0,rested:!!d.rested,overLongSit:!!d.overLongSit,editedAt:d.editedAt||0};

function dayEq(a,b){return JSON.stringify(normDay(a))===JSON.stringify(normDay(b));}

// Review #3 (same as index.html): a history day is dead while its deletion tombstone is
// newer than the entry's manual-edit stamp. Tombstones are grow-only → union/max merge.
function isDeadDay(day,entry){
  return ((S.deletedDays||{})[day]||0) > ((entry&&entry.editedAt)||0);

}
function normalizeCloudSnap(c){
  c=c||{};
  const isV2=(c._schemaVersion||0)>=2 || !!c.state;
  const extractLegacy=(keys)=>{const o={};for(const k of keys)if(k in c)o[k]=c[k];return o;};
  const legacyState=()=>{const s=extractLegacy(STATE_KEYS);s.updatedAt=c.updatedAt||0;return s;};
  const settings=isV2?(c.settings||{}):extractLegacy(SETTINGS_KEYS);
  const activeKey=settings._gardenPeriodKey || periodKeyFrom(settings._gardenPeriodStart);
  const rawGarden=isV2?(c.garden||{}):(Array.isArray(c.garden)?Object.fromEntries((c.garden||[]).map(g=>g?.at?[g.at,g]:null).filter(Boolean)):{});
  return {
    _schemaVersion:c._schemaVersion||(isV2?2:1),
    state:isV2?(c.state||{}):legacyState(),
    history:c.history||{},
    deletedDays:c.deletedDays||{},
    garden:scopeGardenToPeriod(rawGarden,activeKey,settings._gardenPeriodStart),
    gardenArchive:c.gardenArchive||{},
    pets:isV2?(c.pets||{}):extractLegacy(PETS_KEYS),
    settings:settings,
    meta:isV2?(c.meta||{}):extractLegacy(META_KEYS)
  };
}
function flattenCloudForSnap(norm){
  const flat={};
  for(const k of STATE_KEYS) if(k in norm.state) flat[k]=norm.state[k];
  flat.updatedAt=norm.state.updatedAt||0;
  for(const k of PETS_KEYS) if(k in norm.pets) flat[k]=norm.pets[k];
  for(const k of SETTINGS_KEYS) if(k in norm.settings) flat[k]=norm.settings[k];
  for(const k of META_KEYS) if(k in norm.meta) flat[k]=norm.meta[k];
  flat.history=norm.history||{};
  flat.deletedDays=norm.deletedDays||{};
  if(typeof norm.garden==='object'&&!Array.isArray(norm.garden)){
    flat.garden=Object.values(norm.garden).sort((a,b)=>(a?.at||0)-(b?.at||0));
  }else{flat.garden=norm.garden||[];}
  flat.gardenArchive=norm.gardenArchive||{};
  return flat;
}

async function saveSync(){
  saveLocal();
  if(!dbRef)return;
  try{
    S.updatedAt=Date.now();
    const multiPath={};
    const summary={state:0,history:0,pets:0,settings:0,meta:0,garden:0};

    // STATE
    for(const k of STATE_KEYS){
      const a=JSON.stringify(S[k]);
      const b=JSON.stringify(lastCloudSnap?.[k]);
      if(a!==b){multiPath[`state/${k}`]=(S[k]===undefined?null:S[k]);summary.state++;}
    }
    multiPath['state/updatedAt']=S.updatedAt;

    // DELETED DAYS (tombstones — grow-only union, review #3)
    const localDel=S.deletedDays||{};
    const snapDel=lastCloudSnap?.deletedDays||{};
    for(const day of Object.keys(localDel)){
      if((localDel[day]||0)>(snapDel[day]||0)){
        multiPath[`deletedDays/${day}`]=localDel[day];
      }
    }

    // HISTORY (per-day) — tombstoned days are skipped and nulled (review #3)
    const localHist=S.history||{};
    const snapHist=lastCloudSnap?.history||{};
    for(const day of Object.keys(localHist)){
      if(isDeadDay(day,localHist[day]))continue;
      if(!dayEq(localHist[day],snapHist[day])){
        multiPath[`history/${day}`]=localHist[day];
        summary.history++;
      }
    }
    for(const day of Object.keys(snapHist)){
      if(snapHist[day]!=null && isDeadDay(day,snapHist[day]) && !(`history/${day}` in multiPath)){
        multiPath[`history/${day}`]=null;
        summary.history++;
        syncLog('TOMBSTONE_PUSH',{day});
      }
    }
    if(lastCloudSnap){
      const missing=Object.keys(localHist).filter(d=>!(d in snapHist)&&!isDeadDay(d,localHist[d]));
      for(const day of missing){
        if(!(`history/${day}` in multiPath)){
          multiPath[`history/${day}`]=localHist[day];
          summary.history++;
          syncLog('SANITY_PUSH',{day});
        }
      }
    }

    // GARDEN (v2.5: namespaced by period — garden/{periodKey}/{at}; append within current period)
    const pKey=currentPeriodKey();
    const localGarden=S.garden||[];
    const snapGarden=lastCloudSnap?.garden||[];
    const snapAts=new Set(snapGarden.map(g=>g?.at).filter(Boolean));
    for(const g of localGarden){
      if(g?.at && !snapAts.has(g.at)){
        multiPath[`garden/${pKey}/${g.at}`]=g;
        summary.garden++;
      }
    }

    // GARDEN ARCHIVE
    const localArch=S.gardenArchive||{};
    const snapArch=lastCloudSnap?.gardenArchive||{};
    for(const period of Object.keys(localArch)){
      if(JSON.stringify(localArch[period])!==JSON.stringify(snapArch[period])){
        multiPath[`gardenArchive/${period}`]=localArch[period];
      }
    }

    // PETS
    for(const k of PETS_KEYS){
      const a=JSON.stringify(S[k]);
      const b=JSON.stringify(lastCloudSnap?.[k]);
      if(a!==b){multiPath[`pets/${k}`]=(S[k]===undefined?null:S[k]);summary.pets++;}
    }
    // SETTINGS
    for(const k of SETTINGS_KEYS){
      const a=JSON.stringify(S[k]);
      const b=JSON.stringify(lastCloudSnap?.[k]);
      if(a!==b){multiPath[`settings/${k}`]=(S[k]===undefined?null:S[k]);summary.settings++;}
    }
    // META (Math.max - only grow)
    for(const k of META_KEYS){
      const localVal=S[k]||0;
      const snapVal=lastCloudSnap?.[k]||0;
      if(localVal>snapVal){multiPath[`meta/${k}`]=localVal;summary.meta++;}
    }

    multiPath._schemaVersion=SCHEMA_VERSION;
    multiPath.updatedAt=S.updatedAt;

    const realChanges=Object.keys(multiPath).filter(k=>k!=='updatedAt'&&k!=='_schemaVersion'&&k!=='state/updatedAt').length;
    if(realChanges===0&&lastCloudSnap)return;

    syncLog('PUSH',{paths:summary,local:snapS()});
    await update(dbRef,multiPath);
    lastCloudSnap=JSON.parse(JSON.stringify(S));
    setSync('cloud','已同步');
  }catch(e){syncLog('ERROR',{where:'saveSync',msg:e.message});setSync('err','錯誤');}
}

let cloudUnsub=null;
let _miniSyncInFlight=false;
let _connMonitor=null;
onAuthStateChanged(fbAuth,async u=>{
  fbUser=u;
  if(cloudUnsub){cloudUnsub();cloudUnsub=null;}
  if(u){
    dbRef=ref(fbDb,`health-tracker/${u.uid}`);
    updateLogin(u);
    setSync('cloud','同步中');
    // Monitor real connection state. Firebase exposes /.info/connected (true/false).
    // When the network drops the chip shows 離線; when it returns we re-pull.
    if(!_connMonitor){
      _connMonitor=onValue(ref(fbDb,'.info/connected'),s=>{
        const connected=s.val()===true;
        if(!connected){
          setSync('off','離線');
        }else if(dbRef){
          // Reconnected — refresh from cloud so the chip recovers to 已同步.
          cloudPull(false);
        }
      });
    }
    await cloudPull(true);
    cloudUnsub=onValue(dbRef,snap=>{
      if(!snap.exists())return;
      if(_miniSyncInFlight){
        syncLog('LISTENER',{result:'skipped_in_flight'});
        return;
      }
      const rawCloud=snap.val();
      const cn=normalizeCloudSnap(rawCloud);
      const flatCloud=flattenCloudForSnap(cn);
      const cloudUA=cn.state.updatedAt||rawCloud.updatedAt||0;
      if(cloudUA&&S.updatedAt&&cloudUA<=S.updatedAt)return;

      const cloudHistN=Object.keys(cn.history).length;
      const localHistN=Object.keys(S.history||{}).length;
      syncLog('LISTENER',{result:'v2-merge',schema:cn._schemaVersion,cloud:{histN:cloudHistN,lD:cn.state.lastDate,uA:cloudUA},local:snapS()});

      _miniSyncInFlight=true;
      try{
        // Tombstones first (grow-only union) — the history merge below consults them
        S.deletedDays=mergeDeletedDays(S.deletedDays,cn.deletedDays);

        // HISTORY union + Math.max (never shrinks), minus tombstoned days (review #3)
        const mergedHist={...(S.history||{})};
        for(const day of Object.keys(cn.history)){
          mergedHist[day]=mergeDayMax(mergedHist[day],cn.history[day]);
        }
        for(const day of Object.keys(mergedHist)){
          if(mergedHist[day]==null||isDeadDay(day,mergedHist[day]))delete mergedHist[day];
        }
        if(Object.keys(mergedHist).length!==localHistN){
          syncLog('MERGE',{histBefore:localHistN,histAfter:Object.keys(mergedHist).length,delta:Object.keys(mergedHist).length-localHistN,trigger:'mini-listener'});
        }
        S.history=mergedHist;

        // STATE last-write-wins
        if(cloudUA>(S.updatedAt||0)){
          for(const k of STATE_KEYS) if(k in cn.state) S[k]=cn.state[k];
          for(const k of SETTINGS_KEYS) if(k in cn.settings) S[k]=cn.settings[k];
          for(const k of PETS_KEYS){
            if(k in cn.pets){
              if(typeof cn.pets[k]==='number'&&!PET_LWW_KEYS.has(k)) S[k]=Math.max(S[k]||0,cn.pets[k]||0);
              else S[k]=cn.pets[k]; // species + stage: LWW (cloud newer here)
            }
          }
          S.updatedAt=cloudUA;
        }else{
          // cloud not newer: Math.max for counters; stage fields keep local (LWW)
          for(const k of PETS_KEYS){
            if(k in cn.pets && typeof cn.pets[k]==='number'&&!PET_LWW_KEYS.has(k)){
              S[k]=Math.max(S[k]||0,cn.pets[k]||0);
            }
          }
        }

        // META: Math.max
        for(const k of META_KEYS){
          if(k in cn.meta) S[k]=Math.max(S[k]||0,cn.meta[k]||0);
        }

        // GARDEN union by `at` (respects archive cutoff to avoid resurrecting cleared items)
        S._gardenArchivedAt=Math.max(S._gardenArchivedAt||0,cn.settings._gardenArchivedAt||0);
        const cloudGarden=flatCloud.garden||[];
        S.garden=mergeGarden(S.garden,cloudGarden,S._gardenArchivedAt||0);

        S.gardenArchive={...(cn.gardenArchive||{}),...(S.gardenArchive||{})};

        lastCloudSnap=flatCloud;
        saveLocal();
        render();
        setSync('cloud','已同步');
      }finally{
        _miniSyncInFlight=false;
      }
    });
  }else{
    dbRef=null;
    lastCloudSnap=null;
    updateLogin(null);
    setSync('off','本地');
  }
});

async function cloudPull(first){
  if(!dbRef)return;
  try{
    const snap=await getWithTimeout(dbRef);
    if(!snap.exists()){
      syncLog('PULL',{result:'cloud_empty',firstPull:first,local:snapS()});
      if(first)await saveSync();
      setSync('cloud','已同步');
      return;
    }
    const rawCloud=snap.val();
    const cn=normalizeCloudSnap(rawCloud);
    const flatCloud=flattenCloudForSnap(cn);

    const cloudHistN=Object.keys(cn.history).length;
    const localHistN=Object.keys(S.history||{}).length;
    const cloudUA=cn.state.updatedAt||0;
    const localUA=S.updatedAt||0;

    syncLog('PULL',{result:'v2',firstPull:first,schema:cn._schemaVersion,cloud:{histN:cloudHistN,lD:cn.state.lastDate,uA:cloudUA},local:snapS()});

    // Tombstones first (grow-only union) — the history merge below consults them
    S.deletedDays=mergeDeletedDays(S.deletedDays,cn.deletedDays);

    // HISTORY union + Math.max (never shrinks), minus tombstoned days (review #3)
    const mergedHist={...(S.history||{})};
    for(const day of Object.keys(cn.history)){
      mergedHist[day]=mergeDayMax(mergedHist[day],cn.history[day]);
    }
    for(const day of Object.keys(mergedHist)){
      if(mergedHist[day]==null||isDeadDay(day,mergedHist[day]))delete mergedHist[day];
    }
    if(Object.keys(mergedHist).length!==localHistN){
      syncLog('MERGE',{histBefore:localHistN,histAfter:Object.keys(mergedHist).length,delta:Object.keys(mergedHist).length-localHistN,trigger:'mini-v2'});
    }
    S.history=mergedHist;

    // STATE last-write-wins
    if(cloudUA>localUA){
      for(const k of STATE_KEYS) if(k in cn.state) S[k]=cn.state[k];
      for(const k of SETTINGS_KEYS) if(k in cn.settings) S[k]=cn.settings[k];
      for(const k of PETS_KEYS){
        if(k in cn.pets){
          if(typeof cn.pets[k]==='number'&&!PET_LWW_KEYS.has(k)) S[k]=Math.max(S[k]||0,cn.pets[k]||0);
          else S[k]=cn.pets[k]; // species + stage: LWW (cloud newer here)
        }
      }
      S.updatedAt=cloudUA;
    }else{
      // cloud not newer: Math.max for counters; stage fields keep local (LWW)
      for(const k of PETS_KEYS){
        if(k in cn.pets && typeof cn.pets[k]==='number'&&!PET_LWW_KEYS.has(k)){
          S[k]=Math.max(S[k]||0,cn.pets[k]||0);
        }
      }
    }

    // META: Math.max
    for(const k of META_KEYS){
      if(k in cn.meta) S[k]=Math.max(S[k]||0,cn.meta[k]||0);
    }

    // GARDEN union by `at` (respects archive cutoff to avoid resurrecting cleared items)
    S._gardenArchivedAt=Math.max(S._gardenArchivedAt||0,cn.settings._gardenArchivedAt||0);
    const cloudGarden=flatCloud.garden||[];
    S.garden=mergeGarden(S.garden,cloudGarden,S._gardenArchivedAt||0);

    S.gardenArchive={...(cn.gardenArchive||{}),...(S.gardenArchive||{})};

    const rolled=maybeRollover(S);
    if(rolled)syncLog('ROLLOVER',{from:cn.state.lastDate,to:S.lastDate,trigger:'mini-cloudPull-v2'});

    lastCloudSnap=flatCloud;
    saveLocal();
    render();
    if(rolled || Object.keys(S.history||{}).length>cloudHistN){
      await saveSync();
    }
    // Mark sync complete. Without this, when cloud is already up-to-date (no rollover,
    // no extra local history), saveSync never runs and the chip stays stuck on "同步中".
    setSync('cloud','已同步');
    _miniPullRetries=0;
  }catch(e){
    const isTimeout=e&&e.message==='timeout';
    syncLog('ERROR',{where:'mini-cloudPull',msg:e.message,firstPull:first});
    if(isTimeout && _miniPullRetries<3){
      // Network hiccup — show retrying state and try again with backoff.
      _miniPullRetries++;
      setSync('off','連線中…');
      setTimeout(()=>{ if(dbRef) cloudPull(first); }, 3000*_miniPullRetries);
    }else{
      // Give up after retries — show actionable state. The realtime listener may still
      // recover on its own when the network returns, flipping the chip back to 已同步.
      setSync('err', isTimeout?'離線':'錯誤');
    }
  }
}

function now(){return Date.now();}
function fmtTimer(sec){const m=Math.floor(sec/60),s=sec%60;return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;}
function fmtHr(sec){if(!sec||sec<60)return (sec||0)+'s';const m=Math.round(sec/60);if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?`${h}h${r}m`:`${h}h`;}
function totalSS(){if(!S.inSession)return S.sessionSecTotal||0;const live=Math.floor((now()-(S.sessionStartAt||now()))/1000);return (S.sessionAccum||0)+live;}
function currentSitSec(){if(!S.inSession||!S.sitStartAt)return 0;return Math.floor((now()-S.sitStartAt)/1000);}

function tick(){
  if(!S.inSession){render();return;}
  const sit=currentSitSec();
  if(sit>(S.longestSit||0))S.longestSit=sit;
  S.sessionSecTotal=totalSS();
  // Trigger over45 count once per session — when sit first crosses 45m
  if(sit>=LONGEST_WARN_SEC&&!S._over45TriggeredThisSession){
    S._over45TriggeredThisSession=true;
    S.over45CountToday=(S.over45CountToday||0)+1;
  }

}

// === SEED XP (simplified) ===
function addSeedXP(type,xp){
  const idxKey=type==='sit'?'sitStageIdx':'waterStageIdx';
  const xpKey=type==='sit'?'sitStageXP':'waterStageXP';
  const stg=type==='sit'?SIT_STG:WATER_STG;
  if(S[idxKey]>=7)return;
  S[xpKey]=(S[xpKey]||0)+xp;
  while(S[idxKey]<7){
    const need=stg[S[idxKey]].x;
    if(S[xpKey]>=need){
      S[xpKey]-=need;S[idxKey]++;
      if(S[idxKey]===7){
        // Record the harvest as a FACT; index plants it into the garden on next open
        // (mini has no garden logic). HarvestCount only ever grows, so Math.max merging
        // is correct — unlike a "pending" flag, which index would have to clear and a
        // stale client would resurrect (the 69 水滴滴 mechanism).
        S[type+'HarvestCount']=(S[type+'HarvestCount']||0)+1;
        S[idxKey]=0;S[xpKey]=0;
        toast(type==='sit'?'🌳 種子完成！開主程式種進花園':'🌸 種子完成！開主程式種進花園');
      }
    }else break;
  }
}
function checkPetGoals(){
  // 2026-07-17: cap at adult threshold — mini has no checkPetLevelUp, so uncapped counters
  // (e.g. 12) kept resurrecting via Math.max merges after index reset them, causing
  // index to re-graduate a pet on every open (the "69 水滴滴" incident).
  if(!S.sitGoalMetToday&&(S.todayStand||0)>=S_GOAL){S.sitGoalMetToday=true;S.sitPetDays=Math.min((S.sitPetDays||0)+1,PET_ADULT_THRESHOLD);toast('🪑 今日目標達成！');}
  if(!S.waterGoalMetToday&&(S.todayWater||0)>=W_STREAK){S.waterGoalMetToday=true;S.waterPetDays=Math.min((S.waterPetDays||0)+1,PET_ADULT_THRESHOLD);toast('💧 今日目標達成！');}
}

// === ACTIONS ===
// Review #11: mini is a long-lived always-open widget, but only rolled the day over at
// load / cloudPull. A tap after midnight would book onto YESTERDAY's counters (inflating
// yesterday, losing today, and corrupting the streak/snack-pet judgement that #4 added to
// rollover). Guard every recording action.
function rolloverGuard(){
  if(maybeRollover(S)){
    syncLog('ROLLOVER',{from:'stale-open',to:S.lastDate,trigger:'mini-action'});
    stopTick();
    saveSync();
    render();
    toast('🌅 跨日，新的一天開始');
  }
}
function startWork(){
  rolloverGuard();
  const n=now();
  S.inSession=true;
  S.sitStartAt=n;S.sessionStartAt=n;S.sessionAccum=S.sessionSecTotal||0;
  S.alerted=false;S._over45TriggeredThisSession=false;S.sessionsToday=(S.sessionsToday||0)+1;
  render();startTick();saveSync();
}

function handleStandup(){
  rolloverGuard(); // may reset inSession — a session can't span midnight (same as index)
  if(!S.inSession){toast('記得先按開始');return;}
  const sat=currentSitSec();
  const threshSec=(S.thresh||30)*60;
  let xpGain=0,countsAsStand=false,showCard=false;
  if(sat<SILENT){}
  else if(sat<15*60){}
  else if(sat<threshSec){xpGain=2;countsAsStand=true;showCard=true;}
  else if(sat<AWAY){xpGain=1;countsAsStand=true;showCard=true;}
  // else: away zone, 0 XP
  
  if(countsAsStand){
    S.todayStand=(S.todayStand||0)+1;
    S.totalStands=(S.totalStands||0)+1;
    if(xpGain>0)addSeedXP('sit',xpGain);
    checkPetGoals();
  }
  S.sessionSecTotal=totalSS();
  if(sat>(S.longestSit||0))S.longestSit=sat;
  // Count this session toward over45 if it qualifies AND main tab's tick hasn't already
  // counted it (via _over45TriggeredThisSession flag). Prevents double-count when both
  // main and mini are open at the same time.
  if(sat>=LONGEST_WARN_SEC&&!S._over45TriggeredThisSession){
    S._over45TriggeredThisSession=true;
    S.over45CountToday=(S.over45CountToday||0)+1;
  }
  // Reset flag at end of session so next ≥45m sit can be counted
  S._over45TriggeredThisSession=false;
  S.inSession=false;S.sitStartAt=0;S.sessionStartAt=0;S.alerted=false;
  stopTick();
  render();
  saveSync();
  
  if(showCard){
    // Pick activity avoiding recent 5
    const history=Math.min(5,ACTS.length-1);
    let idx,tries=0;
    do{idx=Math.floor(Math.random()*ACTS.length);tries++;}while(recentActs.includes(idx)&&tries<20);
    recentActs.push(idx);
    if(recentActs.length>history)recentActs.shift();
    pendingActivity=ACTS[idx];
    document.getElementById('actTxt').textContent=pendingActivity;
    document.getElementById('actInline').classList.add('show');
    document.getElementById('actDone').style.display='';
    toast(`+${xpGain} XP · 動得好`);
  }else{
    toast('👍 已結束');
  }
}

function doWater(){

function doSnack(){
  rolloverGuard();
  S.todaySnack=(S.todaySnack||0)+1;
  S.totalSnacks=(S.totalSnacks||0)+1;
  const limit=S.snackLimit||3;
  const wasMet=S.snackGoalMetToday!==false;
  S.snackGoalMetToday=S.todaySnack<=limit;
  if(wasMet&&!S.snackGoalMetToday)toast('🍪 超過今日上限');
  render();saveSync();
}
function undoSnack(){
  rolloverGuard(); // post-midnight undo must not shave yesterday's (already archived) count
  if((S.todaySnack||0)<=0){toast('沒有紀錄');return;}
  S.todaySnack=Math.max(0,(S.todaySnack||0)-1);
  S.totalSnacks=Math.max(0,(S.totalSnacks||0)-1);
  const limit=S.snackLimit||3;
  S.snackGoalMetToday=S.todaySnack<=limit;
  render();saveSync();
}

function finishActivity(){
  if(pendingActivity){
    addSeedXP('sit',1);
    toast('💚 +1 XP');
  }
  pendingActivity=null;
  document.getElementById('actInline').classList.remove('show');
  document.getElementById('actDone').style.display='none';
  render();saveSync();
}

// === RENDER ===
function render(){
  applyTheme(S.theme||'default');
  // sit timer & button
  const sitBtn=document.getElementById('sitBtn');
  const sitDisp=document.getElementById('sitDisp');
  const sitSub=document.getElementById('sitSub');
  if(S.inSession){
    const sit=currentSitSec();
    const threshSec=(S.thresh||30)*60;
    sitDisp.textContent=fmtTimer(sit);
    const remain=threshSec-sit;
    if(remain>0)sitSub.textContent=`剩${fmtTimer(remain)}`;
    else sitSub.textContent=`超${fmtTimer(-remain)}`;
    sitBtn.textContent='站起';
  }else{
    sitDisp.textContent='--:--';
    sitSub.textContent=`${S.thresh||30}m`;
    sitBtn.textContent='開始';
  }
  // water
  const wDisp=document.getElementById('wDisp');
  const wSub=document.getElementById('wSub');
  const w=S.todayWater||0;
  const wStr=Number.isInteger(w)?String(w):w.toFixed(1);
  wDisp.textContent=`${wStr}/12`;
  wSub.textContent=`${Math.round(w*ML)} ml`;
  // snack
  const snDisp=document.getElementById('snDisp');
  const snSub=document.getElementById('snSub');
  const sn=S.todaySnack||0;
  const snLimit=S.snackLimit||3;
  const overSn=sn>snLimit;
  snDisp.textContent=`${sn}/${snLimit}`;
  snDisp.classList.toggle('over',overSn);
  // Sub: show candy visual up to 3 (fits in tiny space), use + for extras
  let candies='';
  for(let i=0;i<Math.min(sn,3);i++)candies+='🍬';
  if(sn>3)candies+='🔴';
  if(sn>4)candies+=`+${sn-4}`;
  snSub.textContent=candies||'未吃';
  // stats
  document.getElementById('stStand').textContent=(S.todayStand||0);
  document.getElementById('stWork').textContent=fmtHr(totalSS()||0);
}

// === WIRE UP ===
document.getElementById('sitBtn').addEventListener('click',()=>{
  if(S.inSession)handleStandup();else startWork();
});
document.getElementById('waterBtn').addEventListener('click',doWater);
document.getElementById('snackBtn').addEventListener('click',doSnack);
document.getElementById('snackUndoBtn').addEventListener('click',undoSnack);
document.getElementById('actDone').addEventListener('click',finishActivity);

// Toast
let _toastTimer=null;
function toast(text){
  const t=document.getElementById('toast');
  t.textContent=text;
  t.classList.add('show');
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// Init
render();
if(S.inSession){
  // Resume session if needed
  const live=Math.floor((now()-(S.sessionStartAt||now()))/1000);
  if(live>6*3600){
    S.inSession=false;S.sessionSecTotal=(S.sessionAccum||0);
  }else{
    startTick();
  }
}
</script>
